[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-transformer"
version = "0.1.0"
description = "Graph and vision transformer reference implementations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torch-geometric",
  "torch-scatter",
  "einops",
]

[tool.setuptools]
packages = ["graph_transformer"]
