[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-transformer"
version = "0.1.0"
description = "Graph and vision transformer reference implementations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
  "torch-scatter>=2.1.0",
  "einops>=0.6.0",
]

[tool.setuptools]
packages = ["graph_transformer"]
